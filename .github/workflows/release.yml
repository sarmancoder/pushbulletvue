name: Build and Release Extension

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar pnpm de forma oficial
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest # O una versión específica si lo prefieres, ej: 9.x

      # 3. Configurar Node.js (conectado a pnpm)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # <-- Cambiado a pnpm para usar el gestor de caché correcto

      # 4. Instalar dependencias con pnpm
      - name: Install dependencies
        run: pnpm install

      # 5. Compilar el proyecto
      - name: Build project
        run: pnpm build

      # 6. Comprimir la carpeta dist en un archivo ZIP
      - name: Zip dist folder
        run: |
          cd dist
          zip -r ../extension-release.zip *
          cd ..

      # 7. Generar un número de versión automático
      - name: Generate Release Tag
        id: tag
        run: echo "tag_name=v1.0.$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      # 8. Crear la Release en GitHub y adjuntar el ZIP
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Pushbullet Extension Release ${{ steps.tag.outputs.tag_name }}"
          files: extension-release.zip
          body: |
            ✨ Nueva versión automática de la extensión compilada con pnpm desde la rama `main`.
            📥 Descarga el archivo `extension-release.zip`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}